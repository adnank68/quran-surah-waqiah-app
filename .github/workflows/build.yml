name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 9.1.1 حداقل Gradle 9.3.1 را لازم دارد.
          gradle-version: "9.3.1"

      - name: Bootstrap Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Create the debug keystore
        # روی ماشین توسعه‌ی این پروژه نه JDK هست نه کلید دیباگِ آماده، پس کلید
        # اینجا ساخته می‌شود. هر دو نوع بیلد فعلاً با همین امضا می‌شوند.
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/khatm-waqiah-${{ github.run_number }}.apk"
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: khatm-waqiah-apk
          path: out/*.apk
          retention-days: 90

      - name: Publish a GitHub Release with the APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "نسخه‌ی ${{ github.run_number }}"
          files: out/*.apk
          generate_release_notes: false

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 14
